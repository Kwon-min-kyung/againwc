<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="오늘의 날씨를 실시간으로 확인하세요">
  <title>오늘의 날씨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Jua', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      transition: background 0.6s ease;
    }

    /* 동적 배경 — 날씨에 따라 JS가 클래스 토글 */
    body.sunny   { background: linear-gradient(135deg, #f9d423, #ff4e50); }
    body.cloudy  { background: linear-gradient(135deg, #606c88, #3f4c6b); }
    body.rainy   { background: linear-gradient(135deg, #373b44, #4286f4); }
    body.snowy   { background: linear-gradient(135deg, #e6dada, #274046); }

    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 48px 40px;
      width: 380px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: fadeUp 0.6s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      font-size: 72px;
      margin-bottom: 12px;
      display: inline-block;
      cursor: pointer;
      user-select: none;
      transition: transform 0.3s ease;
    }
    .icon:hover {
      animation: float 1.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-12px) scale(1.08) rotate(3deg);
      }
    }

    .temp {
      font-size: 64px;
      letter-spacing: -0.5px;
    }

    .desc {
      font-size: 18px;
      opacity: 0.85;
      margin-top: 4px;
      font-weight: 600;
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 32px;
    }

    .detail-item {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px 12px;
      transition: transform 0.2s;
    }
    .detail-item:hover { transform: translateY(-3px); }

    .detail-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    .detail-value {
      font-size: 20px;
      font-weight: 600;
    }

    .location {
      margin-bottom: 8px;
      font-size: 14px;
      opacity: 0.7;
      letter-spacing: 0.5px;
    }

    .loading {
      font-size: 18px;
      opacity: 0.8;
    }
    .loading::after {
      content: '';
      animation: dots 1.4s steps(4, end) infinite;
    }
    @keyframes dots {
      0%  { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
    }

    .error { color: #ff6b6b; font-size: 14px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <p class="loading" id="loading">날씨 정보를 불러오는 중</p>
  </div>

  <script>
    // WMO 날씨 코드 → 이모지 & 설명 매핑
    const WMO = {
      0:  { icon: '☀️', desc: '맑음',       bg: 'sunny' },
      1:  { icon: '🌤️', desc: '대체로 맑음', bg: 'sunny' },
      2:  { icon: '⛅',  desc: '구름 조금',   bg: 'cloudy' },
      3:  { icon: '☁️', desc: '흐림',       bg: 'cloudy' },
      45: { icon: '🌫️', desc: '안개',       bg: 'cloudy' },
      48: { icon: '🌫️', desc: '짙은 안개',  bg: 'cloudy' },
      51: { icon: '🌦️', desc: '가벼운 이슬비', bg: 'rainy' },
      53: { icon: '🌦️', desc: '이슬비',     bg: 'rainy' },
      55: { icon: '🌧️', desc: '강한 이슬비', bg: 'rainy' },
      61: { icon: '🌧️', desc: '약한 비',    bg: 'rainy' },
      63: { icon: '🌧️', desc: '비',         bg: 'rainy' },
      65: { icon: '🌧️', desc: '강한 비',    bg: 'rainy' },
      71: { icon: '🌨️', desc: '약한 눈',    bg: 'snowy' },
      73: { icon: '🌨️', desc: '눈',         bg: 'snowy' },
      75: { icon: '❄️', desc: '강한 눈',    bg: 'snowy' },
      80: { icon: '🌦️', desc: '소나기',     bg: 'rainy' },
      81: { icon: '🌧️', desc: '강한 소나기', bg: 'rainy' },
      95: { icon: '⛈️', desc: '뇌우',       bg: 'rainy' },
    };

    function getWeatherInfo(code) {
      return WMO[code] || { icon: '🌡️', desc: '알 수 없음', bg: '' };
    }

    async function fetchWeather(lat, lon) {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}`
        + `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m`
        + `&timezone=auto`;

      const res = await fetch(url);
      if (!res.ok) throw new Error('API 요청 실패');
      return res.json();
    }

    async function fetchCityName(lat, lon) {
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ko`
        );
        const data = await res.json();
        const addr = data.address;
        return addr.city || addr.town || addr.county || addr.state || '내 위치';
      } catch {
        return '내 위치';
      }
    }

    function render(data, city) {
      const c = data.current;
      const info = getWeatherInfo(c.weather_code);

      // 배경색 변경
      document.body.className = info.bg;

      document.getElementById('card').innerHTML = `
        <p class="location">📍 ${city}</p>
        <div class="icon">${info.icon}</div>
        <div class="temp">${Math.round(c.temperature_2m)}°</div>
        <div class="desc">${info.desc}</div>
        <div class="details">
          <div class="detail-item">
            <div class="detail-label">체감온도</div>
            <div class="detail-value">${Math.round(c.apparent_temperature)}°</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">습도</div>
            <div class="detail-value">${c.relative_humidity_2m}%</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">풍속</div>
            <div class="detail-value">${c.wind_speed_10m}<small> km/h</small></div>
          </div>
          <div class="detail-item">
            <div class="detail-label">날씨코드</div>
            <div class="detail-value">${c.weather_code}</div>
          </div>
        </div>
      `;
    }

    function showError(msg) {
      document.getElementById('card').innerHTML =
        `<p class="error">${msg}</p>`;
    }

    // 서울 기본 좌표 (위치 권한 거부 시 폴백)
    const DEFAULT_LAT = 37.5665;
    const DEFAULT_LON = 126.9780;

    async function init(lat, lon, fallback = false) {
      try {
        const [data, city] = await Promise.all([
          fetchWeather(lat, lon),
          fallback ? Promise.resolve('서울') : fetchCityName(lat, lon),
        ]);
        render(data, city);
      } catch (e) {
        showError('날씨 정보를 가져올 수 없습니다 😢');
        console.error(e);
      }
    }

    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(
        pos => init(pos.coords.latitude, pos.coords.longitude),
        ()  => init(DEFAULT_LAT, DEFAULT_LON, true),
        { timeout: 5000 }
      );
    } else {
      init(DEFAULT_LAT, DEFAULT_LON, true);
    }
  </script>
</body>
</html>
